  http://wttr.in/stockholm:
    get:
      tags:
        - wttr.in - Weather in Stockholm
      summary: 1 - Default (metric)
      operationId: weatherStockholmDefault
      parameters:
        - name: User-agent
          in: header
          required: false
          schema:
            type: string
            default: curl/7.88.1
        - name: u
          in: query
          required: false
          description: Use imperial units
          schema:
            type: string
        - name: '0'
          in: query
          required: false
          description: Show only current weather
          schema:
            type: string
        - name: format
          in: query
          required: false
          description: Output format (j1 for JSON, %m for moon phase, etc.)
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            text/plain:
              schema:
                type: string

  http://v2d.wttr.in/stockholm:
    get:
