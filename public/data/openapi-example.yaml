  https://httpbin.org/robots.txt:
    get:
      tags:
        - httpbin.org - Response formats
      summary: robots.txt
      operationId: getRobotsTxt
      parameters:
        - name: accept
          in: header
          required: false
          schema:
            type: string
            default: image/jpeg
      responses:
        '200':
          description: Successful response
          content:
            text/plain:
              schema:
                type: string

  http://cht.sh/:
    get:
      tags:
        - cht.sh - The only cheat sheet you need
      summary: 1 - Root
      operationId: chtshRoot
      parameters:
