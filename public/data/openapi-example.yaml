openapi: 3.1.0
info:
  title: cURL apps
  description: Some example requests to explore Slingshot with.
  version: 1.0.0
  x-postman-id: bda5fd7b-8b68-4d7d-9401-2e37df598b6e

paths:
  https://api.qrserver.com/v1/create-qr-code:
    get:
      tags:
        - goqr.me - QR Code Generator
      summary: Create QR code
      operationId: createQRCode
      parameters:
        - name: size
          in: query
          required: false
          schema:
            type: string
            default: 150x150
          example: 150x150
        - name: data
          in: query
          required: false
          schema:
            type: string
          example: Example
      responses:
        '200':
          description: Successful response
          content:
            image/png:
              schema:
                type: string
                format: binary

  https://picsum.photos/v2/list:
    get:
      tags:
        - picsum.photos - Lorem Picsum API
      summary: 1 - List random images
      operationId: listRandomImages
      responses:
        '200':
      ,     description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  https://picsum.photos/{width}/{height}:
    get:
      tags:
        - picsum.photos - Lorem Picsum API
      summary: 2 - Get random image
      operationId: getRandomImage
      parameters:
        - name: width
          in: path
          required: true
          schema:
            type: integer
          example: 200
        - name: height
          in: path
          required: true
          schema:
            type: integer
          example: 300
      responses:
        '200':
          description: Successful response
          content:
            image/jpeg:
              schema:
                type: string
                format: binary

  https://picsum.photos/id/{id}/{width}/{height}:
    get:
      tags:
        - picsum.photos - Lorem Picsum API
      summary: 3 - Get specific image
      operationId: getSpecificImage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 4
        - name: width
          in: path
          required: true
          schema:
            type: integer
          example: 200
        - name: height
          in: path
          required: true
          schema:
            type: integer
          example: 300
      responses:
        '200':
          description: Successful response
          content:
            image/jpeg:
              schema:
                type: string
                format: binary

  https://picsum.photos/g/{width}/{height}:
    get:
      tags:
        - picsum.photos - Lorem Picsum API
      summary: 4 - Get random grayscale image
      operationId: getRandomGrayscaleImage
      parameters:
        - name: width
          in: path
          required: true
          schema:
            type: integer
          example: 200
        - name: height
          in: path
          required: true
          schema:
            type: integer
          example: 300
      responses:
        '200':
          description: Successful response
          content:
            image/jpeg:
              schema:
                type: string
                format: binary

  https://httpbin.org/image/webp:
    get:
      tags:
        - httpbin.org - Images
      summary: webp
      operationId: getWebpImage
      parameters:
        - name: accept
          in: header
          required: false
          schema:
            type: string
            default: image/jpeg
      responses:
        '200':
          description: Successful response
          content:
            image/webp:
              schema:
                type: string
                format: binary

  https://httpbin.org/image/png:
    get:
      tags:
        - httpbin.org - Images
      summary: png
      operationId: getPngImage
      parameters:
        - name: accept
          in: header
